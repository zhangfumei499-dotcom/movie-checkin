<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>小器皿观团 · 蜘蛛侠签到</title>
  <style>
    :root {
      --bg: #0a0a14; --card-bg: #12122a; --card-border: #2a2a4a;
      --text: #eee; --text-secondary: #88a; --primary: #e50914;
      --primary-hover: #ff1a2e; --gold: #f5c518; --success: #00c853;
      --warning: #ff9100; --input-bg: #1a1a2e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .container { width: 100%; max-width: 420px; }
    .header { text-align: center; padding: 20px 0 12px; }
    .header .logo { font-size: 40px; margin-bottom: 8px; }
    .header h1 { font-size: 22px; font-weight: 700; color: var(--gold); }
    .header .movie-info { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

    .steps { display: flex; align-items: center; justify-content: center; gap: 0; padding: 0 20px 20px; }
    .step-dot {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid var(--card-border); background: transparent;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--text-secondary); font-weight: 600;
      transition: all 0.4s ease; flex-shrink: 0;
    }
    .step-dot.active { border-color: var(--primary); color: var(--primary); background: rgba(229,9,20,0.15); }
    .step-dot.done { border-color: var(--success); color: var(--success); background: rgba(0,200,83,0.15); }
    .step-line { width: 48px; height: 2px; background: var(--card-border); transition: background 0.4s ease; }
    .step-line.done { background: var(--success); }

    .card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 24px 20px; margin-bottom: 12px;
      backdrop-filter: blur(10px);
    }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }

    .search-input {
      width: 100%; padding: 14px 16px; background: var(--input-bg);
      border: 2px solid var(--card-border); border-radius: 12px;
      font-size: 16px; color: var(--text); outline: none; transition: border-color 0.3s;
      font-family: inherit;
    }
    .search-input:focus { border-color: var(--primary); }
    .search-input::placeholder { color: #555; }

    .suggestions {
      margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px;
      max-height: 240px; overflow-y: auto;
    }
    .suggest-item {
      padding: 10px 14px; background: var(--input-bg); border: 1px solid var(--card-border);
      border-radius: 10px; cursor: pointer; font-size: 14px; transition: all 0.2s;
      display: flex; align-items: center; gap: 8px;
    }
    .suggest-item:hover { border-color: var(--primary); background: rgba(229,9,20,0.1); }
    .suggest-item .s-icon { font-size: 18px; }
    .suggest-item .s-group { font-size: 11px; color: var(--text-secondary); margin-left: auto; }

    .btn {
      display: block; width: 100%; padding: 15px; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer; border: none;
      transition: all 0.2s ease; font-family: inherit;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #c41121);
      color: #fff; box-shadow: 0 8px 24px rgba(229,9,20,0.3);
      margin-top: 14px;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(229,9,20,0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-outline { background: transparent; border: 2px solid var(--card-border); color: var(--text-secondary); margin-top: 10px; }
    .btn-outline:hover { border-color: var(--text); color: #fff; }

    .result-section { display: none; }
    .result-section.show { display: block; }
    .hidden { display: none !important; }

    .result-card { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .result-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(42,42,74,0.5); }
    .result-row:last-child { border-bottom: none; }
    .result-label { font-size: 13px; color: var(--text-secondary); }
    .result-value { font-size: 15px; font-weight: 600; }
    .result-value.amount { color: var(--gold); }
    .result-value.free { color: var(--success); }

    .movie-detail { font-size: 12px; color: var(--text-secondary); margin-top: 8px; text-align: center; line-height: 1.6; }

    .checked-in-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,200,83,0.15); border: 1px solid rgba(0,200,83,0.3);
      color: var(--success); padding: 5px 12px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
    }

    .success-toast {
      position: fixed; top: 30px; left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: var(--success); color: #fff;
      padding: 14px 28px; border-radius: 12px; font-weight: 600; font-size: 16px;
      z-index: 200; box-shadow: 0 8px 24px rgba(0,200,83,0.4);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .success-toast.show { transform: translateX(-50%) translateY(0); }

    .error-msg { display: none; color: var(--primary); font-size: 13px; text-align: center; margin-top: 10px; }
    .error-msg.show { display: block; }

    .loading-spinner {
      display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🎬</div>
      <h1>小器皿观团签到</h1>
      <div class="movie-info">《蜘蛛侠-崭新之日》 · 2026年8月</div>

    <div class="steps">
      <div class="step-dot active" id="stepDot1">1</div>
      <div class="step-line" id="stepLine1"></div>

    <!-- Step 1: Search -->
    <div class="result-section show" id="step1">
      <div class="card">
        <div class="card-title">请输入您的姓名</div>
        <input type="text" class="search-input" id="nameInput" placeholder="输入姓名查询签到信息..." autocomplete="off"/>
        <div class="suggestions" id="suggestions"></div>
      </div>
      <div class="error-msg" id="errorMsg">未找到记录，请确认姓名后重试</div>
    </div>

    <!-- Step 2: Confirm Checkin -->
    <div class="result-section" id="step2">
      <div class="result-card" id="resultCard">
        <div id="movieInfo" class="movie-detail"></div>
        <div class="result-row"><span class="result-label">姓名</span><span class="result-value" id="resultName">--</span></div>
        <div class="result-row"><span class="result-label">小组</span><span class="result-value" id="resultGroup">--</span></div>
        <div class="result-row"><span class="result-label">人数</span><span class="result-value" id="resultPeople">--</span></div>
        <div class="result-row"><span class="result-label">金额</span><span class="result-value" id="resultAmount">--</span></div>
        <div class="result-row"><span class="result-label">状态</span><span id="resultStatus">--</span></div>
      </div>
      <button class="btn btn-primary" id="checkinBtn" onclick="confirmCheckin()">确认签到</button>
      <button class="btn btn-outline" onclick="resetAll()">重新查询</button>
    </div>

    <!-- Success Toast -->
    <div class="success-toast" id="successToast">签到成功！</div>
  </div>

      {no:"蜘蛛侠122",name:"达哥",phone:"",people:2,amount:0,group:"全职"},

      {no:"蜘蛛侠128",name:"福妹",phone:"",people:1,amount:15,group:"新人组"},
      {no:"蜘蛛侠129",name:"嘉豪",phone:"",people:1,amount:15,group:"新人组"}
    ];

    var API_BASE = window.location.origin;
    var currentRecord = null;
    var currentMatchName = "";
    var checkedInSet = {};

    var step1 = document.getElementById("step1");
    var step2 = document.getElementById("step2");
    var nameInput = document.getElementById("nameInput");
    var suggestions = document.getElementById("suggestions");
    var errorMsg = document.getElementById("errorMsg");
    var resultCard = document.getElementById("resultCard");
    var movieInfo = document.getElementById("movieInfo");
    var resultName = document.getElementById("resultName");
    var resultGroup = document.getElementById("resultGroup");
    var resultPeople = document.getElementById("resultPeople");
    var resultAmount = document.getElementById("resultAmount");
    var resultStatus = document.getElementById("resultStatus");
    var checkinBtn = document.getElementById("checkinBtn");
    var successToast = document.getElementById("successToast");
    var stepDot1 = document.getElementById("stepDot1");
    var stepDot2 = document.getElementById("stepDot2");
    var stepLine1 = document.getElementById("stepLine1");

    // ============ 加载签到状态 ============
    function loadCheckedIn() {
      fetch(API_BASE + "/api/checkins")
        .then(function(r) { return r.json(); })
        .then(function(res) {
          if (res.success) { checkedInSet = res.data; }
        })
        .catch(function() {
          try {
            var raw = localStorage.getItem("spiderman_checkin_status");
            if (raw) checkedInSet = JSON.parse(raw);
          } catch(e) {}
        });
    }

    // ============ 保存签到状态 ============
    function saveCheckedIn(id, callback) {
      fetch(API_BASE + "/api/checkin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: id })
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.success) {
          checkedInSet[id] = res.data;
          try { localStorage.setItem("spiderman_checkin_status", JSON.stringify(checkedInSet)); } catch(e) {}
          callback(true);
        } else { callback(false); }
      })
      .catch(function() {
        var now = new Date(), h = ("0"+now.getHours()).slice(-2), m = ("0"+now.getMinutes()).slice(-2), s = ("0"+now.getSeconds()).slice(-2);
        var month = ("0"+(now.getMonth()+1)).slice(-2), day = ("0"+now.getDate()).slice(-2);
        checkedInSet[id] = { time: h+":"+m+":"+s, date: now.getFullYear()+"-"+month+"-"+day };
        try { localStorage.setItem("spiderman_checkin_status", JSON.stringify(checkedInSet)); } catch(e) {}
        callback(true);
      });
    }

    // ============ 搜索建议 ============
    nameInput.addEventListener("input", function() {
      var q = this.value.trim();
      suggestions.innerHTML = "";
      errorMsg.classList.remove("show");
      if (!q) return;

      var matches = [];
      signupData.forEach(function(d) {
        var score = matchScore(q, d.name);
        if (score >= 0) matches.push({ record: d, score: score });
      });
      matches.sort(function(a, b) { return b.score - a.score; });
      matches = matches.slice(0, 8);

      matches.forEach(function(m) {
        var div = document.createElement("div");
        div.className = "suggest-item";
        div.innerHTML = '<span class="s-icon">👤</span>' + m.record.name + '<span class="s-group">' + (m.record.group||"") + '</span>';
        div.onclick = function() { selectMatch(m.record, m.record.name); };
        suggestions.appendChild(div);
      });
    });

    function matchScore(query, name) {
      if (!query || !name) return -1;
      var q = query.toLowerCase(), n = name.toLowerCase();
      if (n === q) return 100;
      if (n.indexOf(q) === 0) return 80;
      if (n.indexOf(q) >= 0) return 60;
      var parts = n.split(/[,，、\s]+/);
      for (var i = 0; i < parts.length; i++) {
        if (parts[i] === q) return 75;
        if (parts[i].indexOf(q) === 0) return 55;
        if (parts[i].indexOf(q) >= 0) return 40;
      }
      return -1;
    }

    nameInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        var items = suggestions.children;
        if (items.length === 1) { items[0].click(); } else if (items.length > 0) { items[0].click(); }
      }
    });

    // ============ 选择匹配项 ============
    function selectMatch(record, input) {
      suggestions.innerHTML = "";
      currentRecord = record;
      currentMatchName = input;
      var checkInfo = checkedInSet[record.no];
      var isChecked = !!checkInfo;
      var isFree = record.amount === 0;

      movieInfo.innerHTML = "电影：《蜘蛛侠-崭新之日》<br>活动时间：2026年8月";
      resultName.textContent = record.name;
      resultGroup.textContent = record.group || "未分组";
      resultPeople.textContent = record.people + " 人";
      if (isFree) {
        resultAmount.innerHTML = "免费（¥0.00）";
        resultAmount.classList.add("free");
      } else {
        resultAmount.textContent = "¥" + record.amount.toFixed(2);
        resultAmount.classList.remove("free");
      }

      if (isChecked) {
        resultStatus.innerHTML = '<span class="checked-in-badge">✅ 已签到</span>';
        checkinBtn.textContent = "已签到";
        checkinBtn.disabled = true;
      } else {
        resultStatus.innerHTML = '<span style="color: var(--text-secondary);">待签到</span>';
        checkinBtn.textContent = "确认签到";
        checkinBtn.disabled = false;
      }

      step1.classList.add("hidden");
      step2.classList.add("show");
      updateSteps(2);
    }

    // ============ 确认签到 ============
    function confirmCheckin() {
      if (!currentRecord || checkedInSet[currentRecord.no]) return;

      checkinBtn.disabled = true;
      checkinBtn.innerHTML = '<span class="loading-spinner"></span> 签到中...';

      saveCheckedIn(currentRecord.no, function(success) {
        resultStatus.innerHTML = '<span class="checked-in-badge">✅ 已签到</span>';
        checkinBtn.textContent = "已签到";
        checkinBtn.disabled = false;

        successToast.classList.add("show");
        setTimeout(function() { successToast.classList.remove("show"); }, 3000);
      });
    }

    // ============ 重置 ============
    function resetAll() {
      currentRecord = null;
      currentMatchName = "";
      nameInput.value = "";
      step1.classList.remove("hidden");
      step2.classList.remove("show");
      resultAmount.classList.remove("free");
      errorMsg.classList.remove("show");
      updateSteps(1);
      nameInput.focus();
    }

    function updateSteps(step) {
      stepDot1.className = "step-dot" + (step >= 1 ? " active" : "") + (step > 1 ? " done" : "");
      stepDot2.className = "step-dot" + (step >= 2 ? " active" : "");
      stepLine1.className = "step-line" + (step > 1 ? " done" : "");
    }

    // ============ 初始化 ============
    loadCheckedIn();
    nameInput.focus();
  </script>
</body>
</html>
