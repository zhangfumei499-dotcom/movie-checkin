<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小器皿观团签到</title>
  <style>
    :root {
      --bg: #0a0a14;
      --card-bg: #1a1a2e;
      --card-border: #2a2a4a;
      --primary: #e50914;
      --primary-hover: #ff1a2d;
      --gold: #f5c518;
      --text: #e0e0e0;
      --text-secondary: #8888aa;
      --input-bg: #12122a;
      --input-border: #333366;
      --success: #00c853;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(229, 9, 20, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(245, 197, 24, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(100, 100, 255, 0.05) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }

    .app-container { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 20px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
      transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
    }

    .card::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--gold), var(--primary));
      opacity: 0.8;
    }

    .header { text-align: center; margin-bottom: 32px; }
    .logo { font-size: 48px; margin-bottom: 8px; display: block; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .title { font-size: 26px; font-weight: 700; color: #fff; letter-spacing: 2px; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: var(--text-secondary); letter-spacing: 3px; }

    .steps { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 28px; }
    .step-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--card-border); transition: all 0.3s ease; }
    .step-dot.active { background: var(--primary); box-shadow: 0 0 12px rgba(229,9,20,0.6); width: 12px; height: 12px; }
    .step-dot.done { background: var(--success); }
    .step-line { width: 36px; height: 2px; background: var(--card-border); border-radius: 1px; transition: all 0.3s ease; }
    .step-line.done { background: var(--success); }

    .input-group { margin-bottom: 20px; }
    .input-label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500; }
    .input-wrapper { position: relative; }
    .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--text-secondary); pointer-events: none; }
    .name-input {
      width: 100%; padding: 15px 16px 15px 46px;
      background: var(--input-bg); border: 2px solid var(--input-border);
      border-radius: 14px; font-size: 17px; color: #fff; outline: none;
      transition: all 0.3s ease; font-family: inherit;
    }
    .name-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(229,9,20,0.1); }
    .name-input::placeholder { color: #555; }

    .btn {
      display: block; width: 100%; padding: 15px;
      border: none; border-radius: 14px; font-size: 16px; font-weight: 600;
      cursor: pointer; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      font-family: inherit; letter-spacing: 1px;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), #c70812); color: #fff; box-shadow: 0 8px 24px rgba(229,9,20,0.3); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(229,9,20,0.4); }
    .btn-primary:active { transform: translateY(0); }
    .btn-wechat { background: linear-gradient(135deg, #07c160, #06ad56); color: #fff; box-shadow: 0 8px 24px rgba(7,193,96,0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-wechat:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(7,193,96,0.4); }
    .btn-success { background: linear-gradient(135deg, #00c853, #009624); color: #fff; box-shadow: 0 8px 24px rgba(0,200,83,0.3); }
    .btn-outline { background: transparent; border: 2px solid var(--card-border); color: var(--text-secondary); margin-top: 10px; }
    .btn-outline:hover { border-color: var(--text); color: #fff; }

    .result-section { display: none; animation: slideUp 0.4s ease; }
    .result-section.show { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .result-card {
      background: var(--input-bg); border: 1px solid var(--card-border);
      border-radius: 18px; padding: 20px; margin-bottom: 20px;
    }
    .result-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
    .result-row + .result-row { border-top: 1px solid rgba(255,255,255,0.06); }
    .result-label { font-size: 14px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
    .result-label .icon { font-size: 18px; }
    .result-value { font-size: 18px; font-weight: 700; color: #fff; }
    .result-value.amount { color: var(--gold); font-size: 22px; }
    .result-value.amount.free { color: var(--success); }
    .result-value.group-name { font-size: 13px; font-weight: 500; color: #aab; max-width: 180px; text-align: right; line-height: 1.3; }
    .result-value.name-display { font-size: 16px; }

    .movie-info {
      background: rgba(245,197,24,0.08); border: 1px solid rgba(245,197,24,0.2);
      border-radius: 12px; padding: 10px 14px; margin-bottom: 20px;
      font-size: 13px; color: var(--gold); text-align: center; line-height: 1.6;
    }

    .stats-bar {
      display: flex; gap: 8px; margin-bottom: 20px;
    }
    .stat-item {
      flex: 1; background: var(--input-bg); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 10px 8px; text-align: center;
    }
    .stat-value { font-size: 20px; font-weight: 700; color: #fff; }
    .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

    .error-msg {
      background: rgba(229,9,20,0.1); border: 1px solid rgba(229,9,20,0.3);
      border-radius: 12px; padding: 12px 16px; color: var(--primary);
      font-size: 14px; text-align: center; margin-bottom: 16px;
      display: none; animation: shake 0.4s ease;
    }
    .error-msg.show { display: block; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

    /* 微信支付模拟 */
    .wechat-pay-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 100;
      align-items: center; justify-content: center;
      animation: fadeIn 0.3s ease;
    }
    .wechat-pay-overlay.show { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .wechat-pay-card {
      background: #fff; border-radius: 20px; width: 90%; max-width: 380px;
      overflow: hidden; animation: scaleIn 0.3s ease;
    }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    .wechat-header { background: #07c160; padding: 20px; text-align: center; color: #fff; }
    .wechat-header .wechat-icon { font-size: 32px; margin-bottom: 4px; }
    .wechat-header .wechat-title { font-size: 18px; font-weight: 600; }

    .wechat-body { padding: 24px; color: #333; }
    .wechat-amount-display { text-align: center; padding: 20px 0; border-bottom: 1px solid #eee; margin-bottom: 16px; }
    .wechat-amount-label { font-size: 14px; color: #999; margin-bottom: 6px; }
    .wechat-amount { font-size: 40px; font-weight: 700; color: #333; }
    .wechat-amount .symbol { font-size: 22px; vertical-align: top; margin-right: 2px; }
    .wechat-merchant { display: flex; align-items: center; gap: 10px; padding: 12px 0; font-size: 15px; }
    .wechat-merchant-icon { width: 40px; height: 40px; background: #07c160; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
    .wechat-merchant-name { font-weight: 600; }
    .wechat-merchant-desc { font-size: 12px; color: #999; }
    .wechat-pay-btn { display: block; width: 100%; padding: 15px; background: #07c160; color: #fff; border: none; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer; margin-top: 18px; transition: all 0.2s ease; font-family: inherit; }
    .wechat-pay-btn:hover { background: #06ad56; }
    .wechat-pay-btn:active { transform: scale(0.98); }
    .wechat-close { display: block; width: 100%; padding: 12px; background: transparent; border: none; color: #999; font-size: 14px; cursor: pointer; margin-top: 6px; font-family: inherit; }
    .wechat-close:hover { color: #666; }

    .success-toast {
      position: fixed; top: 30px; left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: var(--success); color: #fff;
      padding: 14px 28px; border-radius: 12px; font-weight: 600; font-size: 16px;
      z-index: 200; box-shadow: 0 8px 24px rgba(0,200,83,0.4);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .success-toast.show { transform: translateX(-50%) translateY(0); }

    .checked-in-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,200,83,0.15); border: 1px solid rgba(0,200,83,0.3);
      color: var(--success); padding: 5px 12px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
    }

    .qr-pay-section {
      text-align: center; padding: 8px 0 16px;
    }
    .qr-pay-img {
      width: 220px; height: 220px; max-width: 100%;
      border-radius: 16px; border: 1px solid var(--card-border);
      background: #fff; padding: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .qr-pay-hint {
      font-size: 12px; color: var(--text-secondary); margin-top: 10px;
      line-height: 1.6;
    }
    .qr-pay-amount {
      font-size: 22px; font-weight: 700; color: var(--gold); margin-bottom: 12px;
    }

    .loading-spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn .loading-spinner { margin-right: 8px; }

    @media (max-width: 480px) {
      .card { padding: 24px 18px; }
      .title { font-size: 22px; }
    }

    .hidden { display: none !important; }
  </style>
</head>

      <!-- 步骤3: 签到完成 + 支付 -->
      <div class="result-section" id="step3">

        </div>
        <div id="step3PayAction">

        <button class="btn btn-outline" onclick="resetAll()">重新签到</button>
      </div>
    </div>
  </div>

      {no:"蜘蛛侠111",name:"上官黎赟",phone:"13960436920",people:1,amount:15,group:"新人组"},
      {no:"蜘蛛侠112",name:"靖妹",phone:"18750519727",people:1,amount:15,group:"大卫不怕巨人队"},
      {no:"蜘蛛侠113",name:"杨柳秋（共5人）",phone:"",people:5,amount:75,group:"未分组"},
      {no:"蜘蛛侠114",name:"安祺",phone:"18750273077",people:1,amount:15,group:"路得继续跟随组"},
      {no:"蜘蛛侠115",name:"林梓瑜，陈翠云",phone:"18859673079",people:2,amount:30,group:"夫妻小组"},
      {no:"蜘蛛侠116",name:"宋一诺",phone:"13860484612",people:1,amount:15,group:"新人组"},
      {no:"蜘蛛侠117",name:"练涵",phone:"13328315212",people:1,amount:15,group:"新人组"},
      {no:"蜘蛛侠118",name:"Rebecca",phone:"",people:4,amount:60,group:"未分组"},
      {no:"蜘蛛侠119",name:"苏祺",phone:"",people:1,amount:15,group:"未分组"},
      {no:"蜘蛛侠120",name:"陈传",phone:"",people:5,amount:0,group:"全职"},
      {no:"蜘蛛侠121",name:"施传 多多 嘉丽 欣怡 何佳妮",phone:"",people:5,amount:0,group:"全职"},
      {no:"蜘蛛侠122",name:"达哥",phone:"",people:2,amount:0,group:"全职"},
      {no:"蜘蛛侠123",name:"朱老师",phone:"",people:1,amount:0,group:"全职"},
      {no:"蜘蛛侠124",name:"斌哥",phone:"",people:1,amount:0,group:"全职"},
      {no:"蜘蛛侠125",name:"宝存大哥儿子",phone:"",people:2,amount:0,group:"全职"},
      {no:"蜘蛛侠126",name:"李牧师",phone:"",people:1,amount:0,group:"全职"},
      {no:"蜘蛛侠128",name:"福妹",phone:"",people:1,amount:15,group:"新人组"}
    ];

    // ============ 签到状态（通过服务器 API 集中存储）============
    var API_BASE = window.location.origin;
    var checkedInSet = {};  // { "蜘蛛侠069": { time: "14:58:30", date: "2026-08-01" }, ... }

    function loadCheckedIn() {
      return fetch(API_BASE + '/api/checkins')
        .then(function(r) { return r.json(); })
        .then(function(res) {
          checkedInSet = res.data || {};
        })
        .catch(function() {
          // 网络错误时兜底读 localStorage
          try {
            var s = localStorage.getItem('spiderman_checkin_status');
            if (s) {
              var p = JSON.parse(s);
              if (Array.isArray(p)) {
                p.forEach(function(id) { checkedInSet[id] = { time: '--', date: '--' }; });
              } else {
                checkedInSet = p;
              }
            }
          } catch(e) {}
        });
    }
    function saveCheckedIn(id, callback) {
      fetch(API_BASE + '/api/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id })
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.success) {
          checkedInSet[id] = res.data;
          if (callback) callback(true);
        } else {
          if (callback) callback(false);
        }
      })
      .catch(function() {
        // 网络错误时本地兜底
        var now = new Date();
        var h = ('0' + now.getHours()).slice(-2);
        var m = ('0' + now.getMinutes()).slice(-2);
        var s = ('0' + now.getSeconds()).slice(-2);
        var month = ('0' + (now.getMonth() + 1)).slice(-2);
        var day = ('0' + now.getDate()).slice(-2);
        checkedInSet[id] = {
          time: h + ':' + m + ':' + s,
          date: now.getFullYear() + '-' + month + '-' + day
        };
        try { localStorage.setItem('spiderman_checkin_status', JSON.stringify(checkedInSet)); } catch(e) {}
        if (callback) callback(true);
      });
    }

    loadCheckedIn();

    // ============ 构建搜索索引 ============
    var nameIndex = {};
    signupData.forEach(function(d) {
      // 精确匹配
      nameIndex[d.name] = d;
      // 提取核心名字（去掉括号备注）
      var core = d.name.replace(/[（(].*?[）)]/g, '').trim();
      if (core && core !== d.name) {
        if (!nameIndex[core]) nameIndex[core] = d;
      }
      // 多人名拆分（空格、中文逗号分隔）
      var parts = d.name.split(/[，,\s]+/);
      parts.forEach(function(p) {
        p = p.trim();
        if (p && p.length >= 2 && !nameIndex[p]) {
          nameIndex[p] = d;
        }
      });
    });

    // ============ 全局状态 ============
    var currentRecord = null;
    var currentMatchName = '';

    // DOM
    var nameInput = document.getElementById('nameInput');
    var searchBtn = document.getElementById('searchBtn');
    var step1 = document.getElementById('step1');
    var step2 = document.getElementById('step2');
    var step3 = document.getElementById('step3');
    var step4 = document.getElementById('step4');
    var errorMsg = document.getElementById('errorMsg');
    var movieInfo = document.getElementById('movieInfo');
    var resultName = document.getElementById('resultName');
    var resultGroup = document.getElementById('resultGroup');
    var resultPeople = document.getElementById('resultPeople');
    var resultAmount = document.getElementById('resultAmount');
    var resultStatus = document.getElementById('resultStatus');
    var checkinBtn = document.getElementById('checkinBtn');
    var successToast = document.getElementById('successToast');
    var step3PayAction = document.getElementById('step3PayAction');
    var step3Msg = document.getElementById('step3Msg');
    var qrPayAmount = document.getElementById('qrPayAmount');
    var qrPayName = document.getElementById('qrPayName');
    var qrPaySection = document.getElementById('qrPaySection');
    var qrPayImg = document.getElementById('qrPayImg');

    var stepDot1 = document.getElementById('stepDot1');
    var stepDot2 = document.getElementById('stepDot2');
    var stepDot3 = document.getElementById('stepDot3');
    var stepLine1 = document.getElementById('stepLine1');
    var stepLine2 = document.getElementById('stepLine2');

    // ============ 搜索 ============
    nameInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') searchBooking();
    });

    function searchBooking() {
      var input = nameInput.value.trim();
      errorMsg.classList.remove('show');

      if (!input) {
        showError('请输入姓名后再查询');
        nameInput.focus();
        return;
      }

      searchBtn.disabled = true;
      searchBtn.innerHTML = '<span class="loading-spinner"></span> 查询中...';

      setTimeout(function() {
        searchBtn.disabled = false;
        searchBtn.innerHTML = '查询观影信息';

        var record = findRecord(input);

        if (!record) {
          showError('未找到「' + input + '」的观影记录，请检查姓名。可尝试输入姓名中的部分文字');
          return;
        }

        currentRecord = record;
        currentMatchName = input;
        var checkInfo = checkedInSet[record.no];
        var isChecked = !!checkInfo;
        var isPaid = checkInfo && checkInfo.paid;
        var isFree = record.amount === 0;

        // 显示电影信息
        movieInfo.innerHTML = '电影：《蜘蛛侠-崭新之日》<br>活动时间：2026年8月';

        // 显示详情
        resultName.textContent = record.name;
        resultGroup.textContent = record.group || '未分组';
        resultPeople.textContent = record.people + ' 人';
        if (isFree) {
          resultAmount.innerHTML = '免费（¥0.00）';
          resultAmount.classList.add('free');
        } else {
          resultAmount.textContent = '¥' + record.amount.toFixed(2);
          resultAmount.classList.remove('free');
        }

        if (isChecked) {
          if (isPaid) {
            resultStatus.innerHTML = '<span class="checked-in-badge">✅ 已签到 · 已支付</span>';
          } else if (isFree) {
            resultStatus.innerHTML = '<span class="checked-in-badge">✅ 已签到 · 免费</span>';
          } else {
            resultStatus.innerHTML = '<span class="checked-in-badge">✅ 已签到 · 待支付</span>';
          }
          checkinBtn.textContent = '已签到';
          checkinBtn.disabled = true;
        } else {
          resultStatus.innerHTML = '<span style="color: var(--text-secondary);">待签到</span>';
          checkinBtn.textContent = '确认签到';
          checkinBtn.disabled = false;
        }

        // 切换步骤
        step1.classList.add('hidden');
        step4.classList.remove('show');

        if (isChecked && (isPaid || isFree)) {
          // 已签到且已支付/免费，直接显示完成
          step2.classList.remove('show');
          step3.classList.remove('show');
          finishAll();
        } else if (isChecked && !isPaid && !isFree) {
          // 已签到但未支付，跳到支付页
          step2.classList.remove('show');
          qrPayAmount.textContent = '¥' + record.amount.toFixed(2);
          qrPayName.textContent = record.name;
          qrPaySection.style.display = 'block';
          step3.classList.add('show');
          step3PayAction.innerHTML = '<button class="btn btn-wechat" onclick="markPaid()"><span>💚</span> 我已完成支付</button>';
          step3Msg.textContent = '请使用微信扫描下方二维码支付';
          updateSteps(3);
        } else {
          // 未签到，显示查询结果
          step2.classList.add('show');
          step3.classList.remove('show');
          updateSteps(2);
        }
      }, 400);
    }

    function findRecord(input) {
      // 1. 精确匹配
      if (nameIndex[input]) return nameIndex[input];

      // 2. 包含匹配（输入是名字的子串）
      var inputLower = input.toLowerCase();
      for (var i = 0; i < signupData.length; i++) {
        var d = signupData[i];
        if (d.name.toLowerCase().indexOf(inputLower) !== -1) return d;
      }

      // 3. 拆分后匹配
      for (var i = 0; i < signupData.length; i++) {
        var d = signupData[i];
        var parts = d.name.split(/[，,\s]+/);
        for (var j = 0; j < parts.length; j++) {
          var p = parts[j].replace(/[（(].*?[）)]/g, '').trim();
          if (p && p.toLowerCase() === inputLower) return d;
        }
      }

      return null;
    }

    // ============ 确认签到 ============
    function confirmCheckin() {
      if (!currentRecord || checkedInSet[currentRecord.no]) return;

      checkinBtn.disabled = true;
      checkinBtn.innerHTML = '<span class="loading-spinner"></span> 签到中...';

      // 通过 API 保存签到状态（服务器集中存储）
      saveCheckedIn(currentRecord.no, function(success) {
        resultStatus.innerHTML = '<span class="checked-in-badge">✅ 已签到</span>';
        checkinBtn.textContent = '已签到';
        checkinBtn.disabled = false;

        var isFree = currentRecord.amount === 0;

        if (isFree) {
          qrPayAmount.textContent = '免费（¥0.00）';
          qrPayName.textContent = currentRecord.name;
          qrPaySection.style.display = 'none';
          step3Msg.textContent = '您无需支付，签到已完成';
          step3PayAction.innerHTML = '<button class="btn btn-success" onclick="finishAll()">完成</button>';
        } else {
          qrPayAmount.textContent = '¥' + currentRecord.amount.toFixed(2);
          qrPayName.textContent = currentRecord.name;
          qrPaySection.style.display = 'block';
          step3Msg.textContent = '请使用微信扫描下方二维码支付';
          step3PayAction.innerHTML = '<button class="btn btn-wechat" onclick="markPaid()"><span>💚</span> 我已完成支付</button>';
        }

        showToast();

        setTimeout(function() {
          step2.classList.remove('show');
          step3.classList.add('show');
          updateSteps(3);
        }, 500);
      });
    }

    // ============ 微信支付 ============
    function markPaid() {
      if (!currentRecord || currentRecord.amount === 0) {
        finishAll();
        return;
      }

      var btn = step3PayAction.querySelector('button');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span> 确认中...';

      fetch(API_BASE + '/api/pay/' + encodeURIComponent(currentRecord.no), {
        method: 'POST'
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.success) {
          checkedInSet[currentRecord.no] = res.data;
          finishAll();
        } else {
          btn.disabled = false;
          btn.innerHTML = '<span>💚</span> 我已完成支付';
          showError(res.error || '标记支付失败，请重试');
        }
      })
      .catch(function() {
        // 网络错误时本地标记
        if (!checkedInSet[currentRecord.no]) checkedInSet[currentRecord.no] = {};
        checkedInSet[currentRecord.no].paid = true;
        try { localStorage.setItem('spiderman_checkin_status', JSON.stringify(checkedInSet)); } catch(e) {}
        finishAll();
      });
    }

    // ============ 全部完成 ============
    function finishAll() {
      var isFree = currentRecord.amount === 0;
      document.getElementById('step4Detail').innerHTML =
        (isFree ? '签到完成，无需支付' : '支付成功！') + '<br>' +
        currentRecord.name + ' · ' + currentRecord.people + '人' +
        (isFree ? '' : ' · ¥' + currentRecord.amount.toFixed(2));

      step3.classList.remove('show');
      step4.classList.add('show');
      stepDot3.classList.add('done');
      stepLine2.classList.add('done');

      successToast.textContent = isFree ? '签到成功！' : '支付成功！';
      successToast.style.background = '#07c160';
      successToast.classList.add('show');
      setTimeout(function() {
        successToast.classList.remove('show');
        successToast.textContent = '签到成功！请完成支付';
        successToast.style.background = 'var(--success)';
      }, 3000);
    }

    // ============ 导航 ============
    function goBack() {
      step2.classList.remove('show');
      step1.classList.remove('hidden');
      errorMsg.classList.remove('show');
      updateSteps(1);
    }

    function resetAll() {
      currentRecord = null;
      currentMatchName = '';
      nameInput.value = '';
      step1.classList.remove('hidden');
      step2.classList.remove('show');
      step3.classList.remove('show');
      step4.classList.remove('show');
      qrPaySection.style.display = 'block';
      step3PayAction.innerHTML = '<button class="btn btn-wechat" onclick="markPaid()"><span>💚</span> 我已完成支付</button>';
      step3Msg.textContent = '请使用微信扫描下方二维码支付';
      resultAmount.classList.remove('free');
      errorMsg.classList.remove('show');
      updateSteps(1);
      nameInput.focus();
    }

    function updateSteps(step) {
      stepDot1.className = 'step-dot' + (step >= 1 ? ' active' : '') + (step > 1 ? ' done' : '');
      stepDot2.className = 'step-dot' + (step >= 2 ? ' active' : '') + (step > 2 ? ' done' : '');
      stepDot3.className = 'step-dot' + (step >= 3 ? ' active' : '');
      stepLine1.className = 'step-line' + (step > 1 ? ' done' : '');
      stepLine2.className = 'step-line' + (step > 2 ? ' done' : '');
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
      setTimeout(function() { errorMsg.classList.remove('show'); }, 4000);
    }

    function showToast() {
      successToast.classList.add('show');
      setTimeout(function() { successToast.classList.remove('show'); }, 2500);
    }

    // ============ 初始化 ============
    nameInput.focus();
  </script>
</body>
