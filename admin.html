<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>后台管理 · 蜘蛛侠签到</title>
  <style>
    :root {
      --bg: #0f0f1a; --card-bg: #1a1a2e; --card-border: #2a2a4a;
      --text: #eee; --text-secondary: #88a; --primary: #e50914;
      --gold: #f5c518; --success: #00c853; --warning: #ff9100;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; min-height: 100vh; }

    .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .login-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 32px 24px; width: 90%; max-width: 360px; text-align: center; }
    .login-card h2 { font-size: 20px; margin-bottom: 8px; }
    .login-card p { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }
    .login-input { width: 100%; padding: 12px; background: #0a0a14; border: 2px solid var(--card-border); border-radius: 10px; color: var(--text); font-size: 16px; text-align: center; outline: none; font-family: inherit; }
    .login-input:focus { border-color: var(--primary); }
    .login-btn { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 14px; font-family: inherit; }
    .login-btn:hover { opacity: 0.9; }
    .login-error { color: var(--primary); font-size: 13px; margin-top: 10px; display: none; }
    .login-error.show { display: block; }

    .main-content { display: none; max-width: 1200px; margin: 0 auto; padding: 16px; }
    .main-content.show { display: block; }

    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 20px; flex-wrap: wrap; gap: 10px; }
    .top-bar h1 { font-size: 20px; color: var(--gold); }
    .top-bar .badge { font-size: 11px; background: var(--card-bg); border: 1px solid var(--card-border); padding: 4px 10px; border-radius: 12px; color: var(--text-secondary); }
    .top-bar .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .top-bar .btn-sm { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; transition: opacity 0.2s; }
    .btn-sm-export { background: #1a3a5c; color: #6db3f2; }
    .btn-sm-clear { background: #3a1a1a; color: #f26d6d; }
    .btn-sm:hover { opacity: 0.8; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
    @media (max-width: 640px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; text-align: center; }
    .stat-num { font-size: 28px; font-weight: 700; }
    .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    .stat-bar { margin-top: 8px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    .stat-bar-fill { height: 100%; background: var(--success); border-radius: 2px; transition: width 0.5s ease; }
    .stat-card.total .stat-num { color: #ddd; }
    .stat-card.checked .stat-num { color: var(--success); }
    .stat-card.paid .stat-num { color: var(--primary); }
    .stat-card.unpaid .stat-num { color: var(--warning); }

    .filter-bar { display: flex; align-items: center; gap: 8px; padding: 12px 0; flex-wrap: wrap; font-size: 14px; }
    .filter-bar select, .search-input {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px;
      color: var(--text); padding: 8px 12px; font-size: 14px; outline: none; font-family: inherit;
    }
    .search-input { min-width: 160px; }

    .tabs { display: flex; gap: 4px; margin: 10px 0; }
    .tab { padding: 8px 18px; background: transparent; border: 1px solid var(--card-border); border-radius: 8px 8px 0 0; color: var(--text-secondary); font-size: 14px; cursor: pointer; font-family: inherit; border-bottom: none; }
    .tab.active { background: var(--card-bg); color: var(--text); }

    .table-wrap { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 0 0 12px 12px; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 12px 14px; color: var(--text-secondary); font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
    td { padding: 10px 14px; border-bottom: 1px solid rgba(42,42,74,0.3); white-space: nowrap; }
    tr:hover td { background: rgba(255,255,255,0.03); }
    tr:last-child td { border-bottom: none; }

    .group-tag { font-size: 12px; color: var(--text-secondary); max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    .badge-done { background: rgba(0,200,83,0.15); color: var(--success); }
    .badge-pending { background: rgba(255,145,0,0.15); color: var(--warning); }
    .badge-free { background: rgba(100,100,255,0.15); color: #8b8bff; }
    .badge-paid { background: rgba(229,9,20,0.15); color: var(--primary); }
    .action-btn { padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; }
    .action-btn.undo { background: rgba(255,145,0,0.2); color: var(--warning); }
    .action-btn.undo:hover { background: rgba(255,145,0,0.4); }
    .action-btn.confirm { background: rgba(0,200,83,0.2); color: var(--success); }
    .action-btn.cancel { background: rgba(229,9,20,0.2); color: var(--primary); }

    .auto-refresh { font-size: 11px; color: var(--text-secondary); text-align: center; padding: 12px; }
  </style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>🔐 后台管理</h2>
    <p>请输入管理员密码</p>
    <input type="password" class="login-input" id="passwordInput" placeholder="输入密码..." onkeydown="if(event.key==='Enter')login()"/>
    <button class="login-btn" onclick="login()">登录</button>
    <div class="login-error" id="loginError">密码错误，请重试</div>
  </div>
</div>

<div class="main-content" id="mainContent">
  <div class="top-bar">
    <div>
      <h1>🎬 小器皿观团 · 签到管理</h1>
      <div class="badge">《蜘蛛侠-崭新之日》</div>
    </div>
    <div class="btns">
      <button class="btn-sm btn-sm-export" onclick="exportCSV()">📥 导出CSV</button>
      <button class="btn-sm btn-sm-clear" onclick="clearAll()">🗑️ 清空记录</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card total">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">名单总人数</div>
    </div>
    <div class="stat-card checked">
      <div class="stat-num" id="statChecked">0</div>
      <div class="stat-label">已签到</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="statBar" style="width:0%"></div></div>
    </div>
    <div class="stat-card paid">
      <div class="stat-num" id="statPaid">0</div>
      <div class="stat-label">已支付</div>
    </div>
    <div class="stat-card unpaid">
      <div class="stat-num" id="statUnpaid">0</div>
      <div class="stat-label">待收金额</div>
    </div>
  </div>

  <div class="filter-bar">
    <label>🏷️ 小组：</label>
    <select id="filterGroup" onchange="renderTables()"><option value="">全部小组</option></select>
    <label style="margin-left:12px;">🔍 搜索：</label>
    <input type="text" class="search-input" id="filterSearch" placeholder="输入姓名搜索..." oninput="renderTables()"/>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabAll" onclick="switchTab('all')">全部</button>
    <button class="tab" id="tabDone" onclick="switchTab('done')">已签到</button>
    <button class="tab" id="tabPending" onclick="switchTab('pending')">待签到</button>
  </div>

  <div class="table-wrap">
    <div class="table-scroll" id="tableContent"></div>
  </div>
  <div class="auto-refresh">数据每 30 秒自动刷新</div>
</div>

  var PASSWORD = "admin123";
  var API_BASE = window.location.origin;

  // ============ 登录 ============
  function login() {
    var pwd = document.getElementById("passwordInput").value;
    if (pwd === PASSWORD) {
      document.getElementById("loginOverlay").style.display = "none";
      document.getElementById("mainContent").classList.add("show");
      init();
    } else {
      document.getElementById("loginError").classList.add("show");
    }
  }

  // ============ 初始化 ============
  function init() {
    // 填充小组筛选
    var groups = {};
    signupData.forEach(function(d) {
      groups[d.group || "未分组"] = true;
    });
    var sel = document.getElementById("filterGroup");
    Object.keys(groups).sort().forEach(function(g) {
      var o = document.createElement("option");
      o.value = g; o.textContent = g;
      sel.appendChild(o);
    });
    refreshAll();
    setInterval(refreshAll, 30000);
  }

  function refreshAll() {
    fetch(API_BASE + "/api/checkins")
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.success) { checkedInSet = res.data; }
        updateStats();
        renderTables();
      })
      .catch(function() { updateStats(); renderTables(); });
  }

  function getCheckedInSync() {
    return checkedInSet;
  }

  function updateStats() {
    var checkedIn = getCheckedInSync();
    var total = 0, totalAmount = 0;
    signupData.forEach(function(d) { total += d.people; totalAmount += d.amount; });

    var checked = 0, paid = 0, unpaidAmount = 0;
    var checkedPeople = 0;

    signupData.forEach(function(d) {
      var info = checkedIn[d.no];
      if (info) {
        checked++;
        checkedPeople += d.people;
        if (d.amount === 0 || info.paid) {
          paid++;
        } else {
          unpaidAmount += d.amount;
        }
      } else {
        unpaidAmount += d.amount;
      }
    });

    var rate = total > 0 ? Math.round((checkedPeople / total) * 100) : 0;

    document.getElementById("statTotal").textContent = total + "人";
    document.getElementById("statChecked").textContent = checked;
    document.getElementById("statPaid").textContent = paid;
    document.getElementById("statUnpaid").textContent = "¥" + unpaidAmount;
    document.getElementById("statBar").style.width = rate + "%";
  }

  function renderTables() {
    var checkedIn = getCheckedInSync();
    var filterGroup = document.getElementById("filterGroup").value;
    var search = document.getElementById("filterSearch").value.trim();

    var data = [];
    signupData.forEach(function(d) {
      if (filterGroup && d.group !== filterGroup) return;
      if (search && d.name.indexOf(search) === -1) return;
      var info = checkedIn[d.no];
      var isChecked = !!info;
      var isFree = d.amount === 0;
      var isPaid = info && (isFree || info.paid);

      if (currentTab === "done" && !isChecked) return;
      if (currentTab === "pending" && isChecked) return;

      data.push({
        no: d.no, name: d.name, group: d.group || "未分组",
        people: d.people, amount: d.amount,
        isChecked: isChecked, isPaid: isPaid, isFree: isFree,
        time: info ? (info.time || "--") : "",
        date: info ? (info.date || "--") : "",
        paidTime: (info && info.paidTime) ? info.paidTime.substr(11,8) : ""
      });
    });

    var html = '<table><thead><tr>' +
      '<th>编号</th><th>姓名</th><th>小组</th>' +
      '<th style="text-align:center">人数</th><th style="text-align:center">金额</th>' +
      '<th style="text-align:center">签到状态</th>' +
      '<th style="text-align:center">支付状态</th>' +
      '<th>签到时间</th>' +
      '<th style="text-align:center">操作</th>' +
      '</tr></thead><tbody>';

    data.forEach(function(d) {
      var statusHtml, statusClass;
      if (d.isChecked) {
        if (d.isFree) { statusHtml = "已签到（免费）"; statusClass = "badge-free"; }
        else { statusHtml = "已签到"; statusClass = "badge-done"; }
      } else {
        statusHtml = "待签到"; statusClass = "badge-pending";
      }

      var payHtml;
      if (!d.isChecked) {
        payHtml = '<span style="color:var(--text-secondary);font-size:12px;">--</span>';
      } else if (d.isFree) {
        payHtml = '<span class="badge badge-free">免费</span>';
      } else if (d.isPaid) {
        payHtml = '<span class="badge badge-paid">已支付 ' + d.paidTime + '</span>';
      } else {
        payHtml = '<span class="badge badge-pending">待支付</span>';
      }

      var opsHtml = "";
      if (d.isChecked) {
        opsHtml = '<button class="action-btn undo" onclick="undoCheckin(\'' + d.no + '\')">撤销签到</button>';
        if (!d.isFree && !d.isPaid) {
          opsHtml += ' <button class="action-btn confirm" onclick="confirmPay(\'' + d.no + '\')">确认收款</button>';
        }
        if (d.isPaid && !d.isFree) {
          opsHtml += ' <button class="action-btn cancel" onclick="cancelPay(\'' + d.no + '\')">取消收款</button>';
        }
      } else {
        opsHtml = '<span style="color:var(--text-secondary);font-size:12px;">--</span>';
      }

      html += '<tr>' +
        '<td>' + d.no.replace("蜘蛛侠","") + '</td>' +
        '<td><strong>' + d.name + '</strong></td>' +
        '<td class="group-tag" title="' + d.group + '">' + d.group + '</td>' +
        '<td style="text-align:center">' + d.people + '</td>' +
        '<td style="text-align:center' + (d.amount===0?';color:#999':'') + '">¥' + d.amount + '</td>' +
        '<td style="text-align:center"><span class="badge ' + statusClass + '">' + statusHtml + '</span></td>' +
        '<td style="text-align:center">' + payHtml + '</td>' +
        '<td>' + (d.isChecked ? (d.date + ' ' + d.time) : '-') + '</td>' +
        '<td style="text-align:center">' + opsHtml + '</td>' +
        '</tr>';
    });

    html += '</tbody></table>';
    document.getElementById("tableContent").innerHTML = html;
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".tab").forEach(function(t) { t.classList.remove("active"); });
    document.getElementById("tab" + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add("active");
    renderTables();
  }

  function undoCheckin(id) {
    if (!confirm("确定撤销 " + id + " 的签到记录？")) return;
    fetch(API_BASE + "/api/checkin/" + encodeURIComponent(id), { method: "DELETE" })
      .then(function(r) { return r.json(); })
      .then(function() { delete checkedInSet[id]; refreshAll(); })
      .catch(function() { delete checkedInSet[id]; refreshAll(); });
  }

  function confirmPay(id) {
    fetch(API_BASE + "/api/pay/" + encodeURIComponent(id), { method: "POST" })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.success) { checkedInSet[id] = res.data; refreshAll(); }
      })
      .catch(function() { checkedInSet[id].paid = true; refreshAll(); });
  }

  function cancelPay(id) {
    fetch(API_BASE + "/api/pay/" + encodeURIComponent(id), { method: "DELETE" })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.success) { checkedInSet[id] = res.data; refreshAll(); }
      })
      .catch(function() { delete checkedInSet[id].paid; refreshAll(); });
  }

  function clearAll() {
    if (!confirm("确定清空所有签到记录？此操作不可撤销！")) return;
    fetch(API_BASE + "/api/checkins/clear", { method: "POST" })
      .then(function() { checkedInSet = {}; refreshAll(); })
      .catch(function() { checkedInSet = {}; refreshAll(); });
  }

  function exportCSV() {
    var checkedIn = getCheckedInSync();
    var rows = [["编号","姓名","小组","人数","金额","签到状态","支付状态","签到日期","签到时间","支付时间"]];
    signupData.forEach(function(d) {
      var info = checkedIn[d.no];
      var isChecked = !!info;
      var isFree = d.amount === 0;
      var isPaid = info && info.paid;
      var payStatus = "";
      if (!isChecked) payStatus = "未签到";
      else if (isFree) payStatus = "免费";
      else if (isPaid) payStatus = "已支付";
      else payStatus = "待支付";
      rows.push([
        d.no, d.name, d.group || "未分组",
        d.people, d.amount,
        isChecked ? "已签到" : "待签到",
        payStatus,
        info ? (info.date || "") : "",
        info ? (info.time || "") : "",
        (info && info.paidTime) ? info.paidTime : ""
      ]);
    });
    var csv = rows.map(function(r) { return r.join(","); }).join("\n");
    var blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "签到记录_" + new Date().toISOString().substr(0,10) + ".csv";
    a.click();
  }
</script>
