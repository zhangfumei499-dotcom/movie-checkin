<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>签到管理后台</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --card-bg: #fff;
      --card-border: #e0e0e0;
      --primary: #e50914;
      --gold: #f5c518;
      --text: #333;
      --text-secondary: #888;
      --success: #00c853;
      --warning: #ff9800;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ====== 登录遮罩 ====== */
    .login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
    }
    .login-overlay.hidden { display: none; }
    .login-card {
      background: #fff; border-radius: 16px; padding: 36px 28px;
      width: 90%; max-width: 360px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .login-card h2 { font-size: 22px; margin-bottom: 6px; }
    .login-card p { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }
    .login-input {
      width: 100%; padding: 14px; border: 2px solid #e0e0e0;
      border-radius: 12px; font-size: 16px; text-align: center;
      outline: none; transition: border 0.2s; font-family: inherit;
    }
    .login-input:focus { border-color: var(--primary); }
    .login-btn {
      width: 100%; padding: 14px; margin-top: 16px; background: var(--primary);
      color: #fff; border: none; border-radius: 12px; font-size: 16px;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .login-btn:hover { background: #c70812; }
    .login-error { color: var(--primary); font-size: 13px; margin-top: 10px; display: none; }
    .login-error.show { display: block; }

    /* ====== 主布局 ====== */
    .admin-container {
      max-width: 960px; margin: 0 auto; padding: 24px 16px;
    }

    /* 顶部栏 */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 24px;
    }
    .top-bar h1 { font-size: 22px; display: flex; align-items: center; gap: 8px; }
    .top-bar h1 .icon { font-size: 26px; }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .top-actions button {
      padding: 8px 16px; border: 1px solid #ddd; border-radius: 8px;
      background: #fff; font-size: 13px; cursor: pointer; font-family: inherit;
      transition: all 0.2s;
    }
    .top-actions button:hover { background: #f0f0f0; }
    .top-actions button.danger { color: var(--primary); border-color: #fcc; }
    .top-actions button.danger:hover { background: #fff0f0; }
    .top-actions button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .top-actions button.primary:hover { background: #c70812; }
    .auto-refresh { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }

    /* 统计卡片 */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: #fff; border-radius: 14px; padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .stat-card .stat-num { font-size: 36px; font-weight: 700; }
    .stat-card .stat-label { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
    .stat-card.total .stat-num { color: #333; }
    .stat-card.checked .stat-num { color: var(--success); }
    .stat-card.pending .stat-num { color: var(--warning); }
    .stat-card.rate .stat-num { color: var(--primary); }
    .stat-card .stat-bar {
      height: 6px; background: #eee; border-radius: 3px; margin-top: 12px; overflow: hidden;
    }
    .stat-card .stat-bar-fill {
      height: 100%; background: var(--success); border-radius: 3px; transition: width 0.5s ease;
    }

    /* 筛选栏 */
    .filter-bar {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center;
    }
    .filter-bar label { font-size: 14px; color: var(--text-secondary); white-space: nowrap; }
    .filter-bar select {
      padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; background: #fff; font-family: inherit; cursor: pointer;
    }
    .filter-bar .search-input {
      padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; width: 180px; font-family: inherit; outline: none;
    }
    .filter-bar .search-input:focus { border-color: var(--primary); }

    /* 标签页 */
    .tabs { display: flex; gap: 0; margin-bottom: 0; }
    .tab {
      padding: 10px 24px; border: 1px solid #ddd; border-bottom: none;
      background: #f9f9f9; font-size: 14px; cursor: pointer; font-family: inherit;
      border-radius: 10px 10px 0 0; transition: all 0.2s;
    }
    .tab:first-child { border-radius: 10px 0 0 0; }
    .tab.active { background: #fff; color: var(--primary); font-weight: 600; }

    /* 表格容器 */
    .table-wrap {
      background: #fff; border: 1px solid #ddd; border-radius: 0 10px 10px 10px;
      overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .table-scroll { max-height: 55vh; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead { position: sticky; top: 0; z-index: 1; }
    th {
      background: #fafafa; padding: 12px 14px; text-align: left;
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      border-bottom: 2px solid #eee; white-space: nowrap;
    }
    td {
      padding: 11px 14px; font-size: 14px; border-bottom: 1px solid #f5f5f5;
    }
    tr:hover td { background: #fafafa; }
    td.status-badge { text-align: center; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 600;
    }
    .badge-done { background: #e8f5e9; color: #2e7d32; }
    .badge-pending { background: #fff3e0; color: #e65100; }
    .badge-free { background: #e3f2fd; color: #1565c0; }
    td.group-tag {
      max-width: 140px; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; font-size: 13px; color: var(--text-secondary);
    }
    td.amount-free { color: #999; }

    .action-btn {
      padding: 4px 10px; border: 1px solid #ddd; border-radius: 6px;
      background: #fff; font-size: 12px; cursor: pointer; font-family: inherit;
      transition: all 0.2s;
    }
    .action-btn.undo { color: var(--warning); border-color: #ffe0b2; }
    .action-btn.undo:hover { background: #fff8e1; border-color: var(--warning); }
    .action-btn:active { transform: scale(0.95); }

    .empty-state {
      text-align: center; padding: 48px 20px; color: var(--text-secondary);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

    /* toast */
    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-120px);
      background: #333; color: #fff; padding: 12px 24px; border-radius: 10px;
      font-size: 14px; z-index: 2000; transition: transform 0.3s ease;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      th, td { padding: 8px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <!-- 登录遮罩 -->

    <div class="login-card">
      <h2>🔐 管理后台</h2>
      <p>请输入管理密码</p>
      <input type="password" class="login-input" id="passwordInput"
        placeholder="输入密码" autocomplete="off" maxlength="20"/>
      <div class="login-error" id="loginError">密码错误，请重试</div>
      <button class="login-btn" onclick="doLogin()">进入后台</button>
    </div>

  <!-- Toast -->

      <div class="auto-refresh">

        <span id="lastRefresh"></span>
      </div>
      <div class="top-actions">
        <button onclick="refreshData()">🔄 刷新</button>

        <button class="danger" onclick="resetAll()">🗑️ 清空签到</button>
        <button onclick="doLogout()">退出</button>
      </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-grid">
      <div class="stat-card total">

        <div class="stat-label">名单总人数</div>
      </div>
      <div class="stat-card checked">

        <div class="stat-label">已签到</div>
        <div class="stat-bar"><div class="stat-bar-fill" id="statBar" style="width:0%"></div></div>
      </div>
      <div class="stat-card pending">
        <div class="stat-num" id="statPending">0</div>
        <div class="stat-label">待签到</div>
      </div>
      <div class="stat-card rate">

    </div>

      <select id="filterGroup" onchange="renderTables()">

      </select>
      <label style="margin-left:12px;">🔍 搜索：</label>
      <input type="text" class="search-input" id="filterSearch"
        placeholder="输入姓名搜索..." oninput="renderTables()"/>
    </div>

    <!-- 标签页 -->
    <div class="tabs">
      <button class="tab active" id="tabAll" onclick="switchTab('all')">全部</button>
      <button class="tab" id="tabDone" onclick="switchTab('done')">已签到</button>
      <button class="tab" id="tabPending" onclick="switchTab('pending')">待签到</button>
    </div>

    <div class="table-wrap">
      <div class="table-scroll" id="tableContent"></div>
    </div>
  </div>

    // ============ 登录 ============
    var ADMIN_PWD = 'admin123';
    var currentTab = 'all';

    function doLogin() {
      var pwd = document.getElementById('passwordInput').value;
      if (pwd === ADMIN_PWD) {
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('mainContent').style.display = 'block';
        initAdmin();
      } else {
        var el = document.getElementById('loginError');
        el.classList.add('show');
        setTimeout(function() { el.classList.remove('show'); }, 2000);
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
      }
    }

    document.getElementById('passwordInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    function doLogout() {
      document.getElementById('loginOverlay').classList.remove('hidden');
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('passwordInput').value = '';
      stopAutoRefresh();
    }

    // ============ 初始化 ============
    function initAdmin() {
      buildGroupFilter();
      renderAll();
      startAutoRefresh();
      document.getElementById('passwordInput').focus();
    }

    var API_BASE = window.location.origin;
    var checkedInCache = {};

    // 从服务器加载签到数据
    function loadCheckedIn() {
      return fetch(API_BASE + '/api/checkins')
        .then(function(r) { return r.json(); })
        .then(function(res) {
          checkedInCache = res.data || {};
          return checkedInCache;
        })
        .catch(function() {
          // 网络错误时读 localStorage 兜底
          try {
            var raw = localStorage.getItem('spiderman_checkin_status');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (Array.isArray(parsed)) {
                var obj = {};
                parsed.forEach(function(id) { obj[id] = { time: '--', date: '--' }; });
                checkedInCache = obj;
              } else {
                checkedInCache = parsed;
              }
            }
          } catch(e) { checkedInCache = {}; }
          return checkedInCache;
        });
    }

    function getCheckedInSync() {
      return checkedInCache;
    }

    function buildGroupFilter() {
      var groups = {};
      signupData.forEach(function(d) {
        var g = d.group || '未分组';
        groups[g] = (groups[g] || 0) + 1;
      });
      var sel = document.getElementById('filterGroup');
      sel.innerHTML = '<option value="">全部小组</option>';
      Object.keys(groups).sort().forEach(function(g) {
        sel.innerHTML += '<option value="' + g + '">' + g + ' (' + groups[g] + ')</option>';
      });
    }

    // ============ 渲染 ============
    function renderAll() {
      loadCheckedIn().then(function() {
        updateStats();
        renderTables();
        updateLastRefresh();
      });
    }

    function updateStats() {
      var checkedIn = getCheckedInSync();
      var total = signupData.length;
      var checked = Object.keys(checkedIn).length;
      var pending = total - checked;
      var rate = total > 0 ? Math.round((checked / total) * 100) : 0;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statChecked').textContent = checked;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statRate').textContent = rate + '%';
      document.getElementById('statBar').style.width = rate + '%';
    }

    function renderTables() {
      var checkedIn = getCheckedInSync();
      var filterGroup = document.getElementById('filterGroup').value;
      var filterSearch = document.getElementById('filterSearch').value.toLowerCase();

      var list = [];
      signupData.forEach(function(d) {
        var dGroup = d.group || '未分组';
        if (filterGroup && dGroup !== filterGroup) return;
        if (filterSearch && d.name.toLowerCase().indexOf(filterSearch) === -1) return;

        var info = checkedIn[d.no];
        var isChecked = !!info;
        list.push({
          no: d.no, name: d.name, group: dGroup,
          people: d.people, amount: d.amount,
          isChecked: isChecked,
          time: isChecked ? (info.time || '--') : '',
          date: isChecked ? (info.date || '--') : ''
        });
      });

      // 按签到状态排序（未签到在前）+ 按编号排序
      list.sort(function(a, b) {
        if (a.isChecked !== b.isChecked) return a.isChecked ? 1 : -1;
        return a.no.localeCompare(b.no);
      });

      // 筛选
      var filtered = list;
      if (currentTab === 'done') filtered = list.filter(function(x) { return x.isChecked; });
      if (currentTab === 'pending') filtered = list.filter(function(x) { return !x.isChecked; });

      renderTable(filtered);
    }

    function renderTable(data) {
      var container = document.getElementById('tableContent');
      if (data.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无数据</p></div>';
        return;
      }

      var html = '<table><thead><tr>' +
        '<th>编号</th><th>姓名</th><th>小组</th>' +
        '<th style="text-align:center">人数</th><th style="text-align:center">金额</th>' +
        '<th style="text-align:center">签到状态</th><th>签到时间</th>' +
        '<th style="text-align:center">操作</th>' +
        '</tr></thead><tbody>';

      data.forEach(function(d) {
        var statusHtml, statusClass;
        if (d.isChecked) {
          if (d.amount === 0) {
            statusHtml = '已签到（免费）';
            statusClass = 'badge-free';
          } else {
            statusHtml = '已签到';
            statusClass = 'badge-done';
          }
        } else {
          statusHtml = '待签到';
          statusClass = 'badge-pending';
        }

        html += '<tr>' +
          '<td>' + d.no + '</td>' +
          '<td><strong>' + d.name + '</strong></td>' +
          '<td class="group-tag" title="' + d.group + '">' + d.group + '</td>' +
          '<td style="text-align:center">' + d.people + '</td>' +
          '<td style="text-align:center' + (d.amount === 0 ? ';color:#999' : '') + '">¥' + d.amount + '</td>' +
          '<td class="status-badge"><span class="badge ' + statusClass + '">' + statusHtml + '</span></td>' +
          '<td>' + (d.isChecked ? (d.date + ' ' + d.time) : '-') + '</td>' +
          '<td style="text-align:center">' +
            (d.isChecked ? '<button class="action-btn undo" onclick="undoCheckin(\'' + d.no + '\')">撤销</button>' : '-') +
          '</td>' +
          '</tr>';
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabAll').className = 'tab' + (tab === 'all' ? ' active' : '');
      document.getElementById('tabDone').className = 'tab' + (tab === 'done' ? ' active' : '');
      document.getElementById('tabPending').className = 'tab' + (tab === 'pending' ? ' active' : '');
      renderTables();
    }

    // ============ 刷新 ============
    function refreshData() {
      renderAll();
      showToast('已刷新');
    }

    function updateLastRefresh() {
      var now = new Date();
      var h = ('0' + now.getHours()).slice(-2);
      var m = ('0' + now.getMinutes()).slice(-2);
      var s = ('0' + now.getSeconds()).slice(-2);
      document.getElementById('lastRefresh').textContent = h + ':' + m + ':' + s;
    }

    var autoRefreshTimer = null;
    function startAutoRefresh() {
      stopAutoRefresh();
      autoRefreshTimer = setInterval(renderAll, 30000);
    }
    function stopAutoRefresh() {
      if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
    }

    // ============ 导出 ============
    function exportCSV() {
      var checkedIn = getCheckedInSync();
      var rows = [['编号','姓名','小组','人数','金额','签到状态','签到日期','签到时间']];
      signupData.forEach(function(d) {
        var info = checkedIn[d.no];
        rows.push([
          d.no, d.name, d.group || '未分组',
          d.people, d.amount,
          info ? '已签到' : '待签到',
          info ? (info.date || '') : '',
          info ? (info.time || '') : ''
        ]);
      });
      var csv = rows.map(function(r) {
        return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
      }).join('\n');

      var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = '签到记录_' + new Date().toISOString().slice(0,10) + '.csv';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
      showToast('导出成功');
    }

    // ============ 清空 ============
    function resetAll() {
      if (!confirm('确定要清空所有签到记录吗？此操作不可撤销！')) return;
      fetch(API_BASE + '/api/checkins/reset', { method: 'POST' })
        .then(function() {
          checkedInCache = {};
          renderAll();
          showToast('签到记录已清空');
        })
        .catch(function() {
          try { localStorage.removeItem('spiderman_checkin_status'); } catch(e) {}
          checkedInCache = {};
          renderAll();
          showToast('签到记录已清空（本地）');
        });
    }

    // ============ 撤销签到 ============
    function undoCheckin(no) {
      var record = signupData.find(function(d) { return d.no === no; });
      var name = record ? record.name : no;
      if (!confirm('确定要撤销「' + name + '」的签到记录吗？')) return;

      fetch(API_BASE + '/api/checkin/' + encodeURIComponent(no), { method: 'DELETE' })
        .then(function(r) { return r.json(); })
        .then(function() {
          delete checkedInCache[no];
          renderAll();
          showToast('已撤销「' + name + '」的签到');
        })
        .catch(function() {
          // 网络错误时本地操作
          delete checkedInCache[no];
          try { localStorage.setItem('spiderman_checkin_status', JSON.stringify(checkedInCache)); } catch(e) {}
          renderAll();
          showToast('已撤销「' + name + '」的签到（本地）');
        });
    }

    // ============ Toast ============
    function showToast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(function() { el.classList.remove('show'); }, 2000);
    }

    // ============ 启动 ============
    document.getElementById('passwordInput').focus();
  </script>
</body>
</html>
